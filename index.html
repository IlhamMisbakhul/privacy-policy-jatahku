<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Privacy Policy</title>
    <meta id="page-description" name="description" content="Privacy Policy">
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="js/config.js"></script>
    <script defer src="js/locales/id.js"></script>
    <script defer src="js/locales/ms.js"></script>
    <script defer src="js/locales/en.js"></script>
    <script defer src="js/locales/es.js"></script>
    <script defer src="js/locales/nl.js"></script>
    <script defer src="js/locales/it.js"></script>
    <script defer src="js/locales/pt.js"></script>
    <script defer src="js/locales/fr.js"></script>
    <script defer src="js/locales/ja.js"></script>
    <script defer src="js/locales/ko.js"></script>
    <script defer src="js/locales/ru.js"></script>
    <script defer src="js/locales/zh.js"></script>
    <script defer src="js/locales/ar.js"></script>
    <script defer src="js/locales/hi.js"></script>
    <script defer src="js/i18n.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" id="skip-link" href="#policy-sections">Skip to content</a>

    <!-- Publication gate: hidden automatically once js/config.js has no
         placeholder values left and every translation is marked reviewed. -->
    <div class="notice" id="publication-notice" role="status" hidden></div>

    <header class="site-header">
      <div class="wrap">
        <p class="app-name" id="app-name"></p>
        <h1 id="policy-title">Privacy Policy</h1>
        <p class="subtitle" id="policy-subtitle"></p>
        <p class="policy-dates" id="policy-dates"></p>

        <div class="language-control">
          <label for="language-select" id="language-label">Language</label>
          <select id="language-select" name="language" aria-label="Language"></select>
        </div>

        <nav class="toc" aria-labelledby="toc-title">
          <h2 id="toc-title">Contents</h2>
          <ol id="toc-list" class="toc-list"></ol>
        </nav>
      </div>
    </header>

    <main class="wrap" id="policy-sections">
      <noscript>
        <p class="noscript">
          This page displays the Privacy Policy in your selected language using
          JavaScript. Please enable JavaScript to read the policy.
        </p>
      </noscript>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p id="footer-identity"></p>
        <p id="footer-note"></p>
        <p class="to-top"><a href="#policy-sections" id="back-to-top">Back to top</a></p>
      </div>
    </footer>

    <p class="visually-hidden" id="live-region" role="status" aria-live="polite"></p>
  </body>
</html>
